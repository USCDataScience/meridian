[project]
name = "meridian"
version = "0.1.0"
description = "Point it at a corpus. Cut it on concept, place, and time."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Chris Mattmann" }]
dependencies = [
  "tika>=2.6.0",
  "spacy>=3.7.0",
  "quantulum3>=0.9.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "pyyaml>=6.0",
]

[project.scripts]
meridian = "meridian.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["meridian*"]
